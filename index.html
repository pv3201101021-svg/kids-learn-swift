  <style>
    /* Duolingo Math 明亮風格 */
    body { font-family:'Nunito',sans-serif; background:#ECF8FF; color:#131F24; overflow-x:hidden; }
    ::-webkit-scrollbar { width:6px; }
    ::-webkit-scrollbar-track { background:#ECF8FF; }
    ::-webkit-scrollbar-thumb { background:#1CB0F6; border-radius:3px; }
    /* KaTeX 數學公式增強樣式 */
    .katex { font-size:1.15em!important; color:#131F24!important; }
    .katex .mord { color:#131F24!important; }
    .katex .mbin { color:#131F24!important; }
    .katex .mop { color:#1CB0F6!important; }
    .katex .mrel { color:#FF9600!important; }
    .katex .mopen, .katex .mclose { color:#6B7C8A!important; }
    .katex-display { margin:1em 0!important; }
    .katex-display .katex-math-block { overflow-x:auto; padding:0.5em 0; }
    .katex-math-block { display:inline-block; }
    .math-display { background:#f8f9fa; border-radius:12px; padding:16px 24px; margin:12px 0; text-align:center; overflow-x:auto; }
    .math-inline { background:#fffbeb; border-radius:6px; padding:2px 6px; }
    .katex-error { color:#FF4B4B; background:#ffeaea; padding:8px 12px; border-radius:8px; font-size:0.9em; }
    .katex-error-inline { color:#FF4B4B; border-bottom:2px dashed #FF4B4B; }
    /* 確保題目和選項中的數學公式正確顯示 */
    .math-q .katex, .math-opt .katex, .math-hint .katex { font-size:1.1em!important; }
    .solution-content { line-height:1.8; }
    .hint-text { line-height:1.7; }
    .hint-content { max-height:0; overflow:hidden; transition:max-height 0.4s ease, opacity 0.3s ease, padding 0.3s ease; opacity:0; padding-top:0; padding-bottom:0; }
    .hint-content.show { max-height:200px; opacity:1; padding-top:0.75rem; padding-bottom:0.75rem; }
    .feedback-bar { transform:translateY(100%); transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1); }
    .feedback-bar.show { transform:translateY(0); }
    .choice-btn { transition:all 0.15s ease; }
    .choice-btn:hover:not(:disabled) { transform:translateY(-2px); }
    .choice-btn:active:not(:disabled) { transform:translateY(1px); }
    .subject-btn { transition:all 0.15s ease; }
    .subject-btn:hover { transform:scale(1.06); }
    .subject-btn:active { transform:scale(0.96) translateY(2px); box-shadow:none!important; }
    .page-enter { animation:fadeInUp 0.35s ease forwards; }
    @keyframes fadeInUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
    .streak-fire { animation:pulse 1.5s ease infinite; }
    .progress-fill { transition:width 0.8s cubic-bezier(0.4,0,0.2,1); }
    @keyframes circleProgress { from{stroke-dashoffset:314} }
    /* Duolingo Math 卡片風格 */
    .card-bg { background:#fff; }
    .text-primary { color:#131F24; }
    .text-secondary { color:#6B7C8A; }
    .border-card { border:2px solid #E5E5E5; }
    .correct-btn { background:#58CC02!important; color:#fff!important; }
    .wrong-btn { background:#FF4B4B!important; color:#fff!important; }
    .math-icon-bg { background:linear-gradient(135deg,#1CB0F6 0%,#58CC02 100%); }
  /* 選項按鈕選中狀態 */

  .choice-btn.selected-wrong { background:#FF4B4B!important; color:#fff!important; border-color:#ea2b2b!important; }
  /* 題目卡片增強陰影 */
  .question-card-shadow { box-shadow:0 4px 20px rgba(0,0,0,0.08); }

  .dark-mode {

  .dark-mode .text-gray-600 { color:var(--text-secondary)!important; }
  .dark-mode .text-gray-500 { color:var(--text-secondary)!important; }
  .dark-mode .text-gray-400 { color:var(--text-secondary)!important; }

  .dark-mode .border-gray-200 { border-color:var(--border-color)!important; }

  .theme-toggle {

  }

  }
  /* 記憶技巧卡片樣式 */
  .memory-card {

  }
  .memory-card:hover {
    transform:translateY(-2px);
    box-shadow:0 6px 20px rgba(0,0,0,0.12);
  }
  </style>

function sc2tc(t){return t.split('').map(c=>SC_TC[c]||c).join('');}
function normalize(t){return sc2tc(t).trim().toLowerCase();}
function checkMatch(input,expected){
  if(normalize(input)===normalize(expected)) return true;
  return false;
}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

function splitQuote(q){
  for(const p of ['，','；','。','！','？']){
    const i=q.indexOf(p);
    if(i>0&&i<q.length-1) return {first:q.substring(0,i).trim(),second:q.substring(i+p.length).trim()};
  }
  const m=Math.floor(q.length/2);
  return {first:q.substring(0,m).trim(),second:q.substring(m).trim()};
}

function extractKeyword(q){
  const cleaned=q.replace(/[，。、；：！？""''（）《》\s]/g,'');
  for(let len=4;len>=2;len--){
    for(let i=0;i<=cleaned.length-len;i++){
      const w=cleaned.substring(i,i+len);
      if(q.includes(w)&&w.length>=2) return w;
    }
  }
  return cleaned.substring(Math.floor(cleaned.length/2),Math.floor(cleaned.length/2)+2);
}

function daySeed(){const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();}
function seededRand(s){return(Math.sin(s)*10000)%1<0?-(Math.sin(s)*10000)%1:(Math.sin(s)*10000)%1;}

// ============================================================
// 渲染 KaTeX - 增強版：自動檢測並渲染所有數學公式
// ============================================================
function renderMathInElement(el){
  if(!el || typeof katex === 'undefined') return;
  const html = el.innerHTML;
  const result = processMathText(html);
  el.innerHTML = result;
}

// 處理文本中的數學公式（支持 $...$ 和 $$...$$）
function processMathText(text){
  if(!text) return '';
  
  // 處理 display mode 數學公式 $$...$$
  text = text.replace(/\$\$([\s\S]*?)\$\$/g, (match, math) => {
    try {
      return `<div class="katex-display"><div class="katex-math-block">${katex.renderToString(math.trim(), {displayMode: true, throwOnError: false})}</div></div>`;
    } catch(e) {
      return `<div class="katex-error">$$${math}$$</div>`;
    }
  });
  
  // 處理 inline mode 數學公式 $...$
  text = text.replace(/\$([^\$\n]+?)\$/g, (match, math) => {
    try {
      return katex.renderToString(math.trim(), {displayMode: false, throwOnError: false});
    } catch(e) {
      return `<span class="katex-error-inline">$${math}$</span>`;
    }
  });
  
  return text;
}

// 渲染指定容器內所有數學元素
function renderAllMath(container) {
  if(!container) return;
  const mathElements = container.querySelectorAll('.math-q, .math-opt, .math-hint, .solution-content, .hint-text');
  mathElements.forEach(el => {
    if(el.dataset.mathRendered !== 'true') {
      renderMathInElement(el);
      el.dataset.mathRendered = 'true';
    }
  });
}

let state = {
  page:'home',
  subject:null,
  questions:[],
  currentQ:0,
  results:[],
  streak:0,
  totalXP:0,
  dailyProgress:0,
  completedToday:{},
  wrongAnswers:[], // 錯題記錄
  darkMode:false    // 深色模式開關
};

function loadState(){
  const d=JSON.parse(localStorage.getItem('eduspark_data')||'{}');
  state.totalXP=d.totalXP||0;
  const today=new Date().toDateString();
  const last=d.lastLoginDate;
  if(last!==today){
    const y=new Date();y.setDate(y.getDate()-1);
    if(last===y.toDateString()) state.streak=(d.streak||0)+1;
    else state.streak=1;
    localStorage.setItem('eduspark_data',JSON.stringify({...d,streak:state.streak,lastLoginDate:today}));
  } else state.streak=d.streak||0;
  const c=JSON.parse(localStorage.getItem('eduspark_completed')||'{}');
  state.completedToday=c[today]||{};
  state.dailyProgress=Math.round(Object.keys(state.completedToday).length/3*100);
  // 載入錯題記錄
  const w=JSON.parse(localStorage.getItem('eduspark_wrong')||'[]');
  state.wrongAnswers=w;
}

// 記錄錯題
function recordWrongAnswer(question, userAnswer, correctAnswer, subject, options, hint, fullQuote, type, alts, userAnswerIndex){
  const wrong={
    subject:subject,
    question:question,
    userAnswer:userAnswer,
    correctAnswer:correctAnswer,
    options:options||null,
    hint:hint||'',
    fullQuote:fullQuote||'',
    type:type||'choice',
    alts:alts||null,
    userAnswerIndex:userAnswerIndex,
    timestamp:new Date().toISOString()
  };
  state.wrongAnswers.push(wrong);
  localStorage.setItem('eduspark_wrong',JSON.stringify(state.wrongAnswers));
}

// 獲取某科目的錯題
function getWrongAnswersBySubject(subject){
  return state.wrongAnswers.filter(w=>w.subject===subject);
}

// 移除單個錯題（答對後自動移除）
function removeWrongAnswer(question, subject){
  state.wrongAnswers=state.wrongAnswers.filter(w=>!(w.subject===subject&&w.question===question));
  localStorage.setItem('eduspark_wrong',JSON.stringify(state.wrongAnswers));
}

// 清除某科目的錯題
function clearWrongAnswers(subject){
  state.wrongAnswers=state.wrongAnswers.filter(w=>w.subject!==subject);
  localStorage.setItem('eduspark_wrong',JSON.stringify(state.wrongAnswers));
}

function saveCompletion(subject){
  const today=new Date().toDateString();
  const c=JSON.parse(localStorage.getItem('eduspark_completed')||'{}');
  if(!c[today])c[today]={};
  c[today][subject]=true;
  localStorage.setItem('eduspark_completed',JSON.stringify(c));
  state.completedToday=c[today];
  state.dailyProgress=Math.round(Object.keys(state.completedToday).length/3*100);
}

function addXP(xp){
  state.totalXP+=xp;
  const d=JSON.parse(localStorage.getItem('eduspark_data')||'{}');
  localStorage.setItem('eduspark_data',JSON.stringify({...d,totalXP:state.totalXP}));
}

// 深色/淺色模式切換
// ============================================================
function toggleDarkMode(){
  state.darkMode = !state.darkMode;
  document.body.classList.toggle('dark-mode', state.darkMode);
  localStorage.setItem('eduspark_dark', state.darkMode?'1':'0');
  render(); // 重新渲染以應用新主題
}

function initDarkMode(){
  const saved = localStorage.getItem('eduspark_dark');
  if(saved === '1'){
    state.darkMode = true;
    document.body.classList.add('dark-mode');
  }
}

/**
 * 根據名句生成記憶技巧
 * @param {string} quote - 完整名句
 * @returns {object} 包含 visual, compare, scene, keyword 的記憶技巧對象
 */
function generateMemoryTip(quote){
  if(!quote) return getDefaultMemoryTip();
  
  const trimmedQuote = quote.replace(/[「」""'']/g, '').trim();
  
  // 先嘗試精確匹配
  if(MEMORY_TIPS[trimmedQuote]){
    return MEMORY_TIPS[trimmedQuote];
  }
  
  // 模糊匹配：檢查是否包含某個關鍵片段
  for(const key of Object.keys(MEMORY_TIPS)){
    if(key.length >= 6 && (trimmedQuote.includes(key) || key.includes(trimmedQuote.substring(0, Math.min(8, trimmedQuote.length))))){
      return MEMORY_TIPS[key];
    }
  }
  
  // 根據名句特徵生成通用記憶技巧
  return generateDynamicMemoryTip(trimmedQuote);
}

function getDefaultMemoryTip(){
  return {
    visual: '📖 把這句話想像成一個生動的畫面：試著在腦海中「播放」一段關於這句古文的短影片',
    compare: '💡 技巧：將抽象文字轉化為具體影像 — 大腦對圖像的記憶力是文字的數倍！',
    scene: '🎬 閉上眼睛，想像自己是古代的文人墨客，身臨其境地感受這句話的意境',
    keyword: '【記憶口訣】理解意境 → 聯想畫面 → 反覆吟誦'
  };
}

function generateDynamicMemoryTip(quote){
  const len = quote.length;
  const hasNature = /山|水|風|雨|雪|月|花|草|樹|雲|河|海|江/.test(quote);
  const hasEmotion = /悲|喜|怒|哀|樂|愁|思|念|恨|愛|淚/.test(quote);
  const hasTime = /昔|今|朝|暮|春|秋|冬|夏|年|月|日/.test(quote);
  
  let visual = '';
  let compare = '';
  
  if(hasNature && hasEmotion){
    visual = `🌿💭 這句融合了自然景色(${hasNature?'✓':''})和人物情感(${hasEmotion?'✓':''})，想像自己置身其中：周圍是${quote.match(/山|水|風|雨|雪|月|花|草|樹|雲|河|海|江/)?.[0]||'大自然'}，心中懷著${quote.match(/悲|喜|怒|哀|樂|愁|思|念|恨|愛|淚/)?.[0]||'感慨'}`;
    compare = '🔄 情景交融：古人擅長借景抒情 — 外界環境反映內心世界，理解了背景就能理解情感';
  } else if(hasTime){
    visual = `⏰📜 這句涉及時間流逝或對比（${quote.match(/昔|今|朝|暮|春|秋|冬|夏/)?.[0]||'時間'}），想像時間軸上的變化：過去 vs 現在，或此刻的不同狀態`;
    compare: '⚡ 時間維度：古今對比、早晚對比、四季對比 — 時間的流逝往往帶來深刻的感悟';
  } else {
    visual = `💡📝 這句話「${quote.substring(0, Math.min(10, len))}...」，試著拆解：找到其中的對仗、押韻或反義詞`;
    compare: '🔍 分析技巧：注意句式結構 — 排比增強語氣、對偶便於記憶、反襯突出重點';
  }
  
  return {
    visual: visual,
    compare: compare,
    scene: `🎭 想像朗誦這句話時的語調：哪里該停頓、哪里該加重語氣？用自己的方式演繹它`,
    keyword: `【快速記憶】抓住關鍵字：${quote.substring(0, 4)}... → 理解含義 → 腦海成像`
  };
}

function genChinese(){
  // 使用真正隨機數，每次練習都不同
  // 從3句不同詩句中各生成1道題目
  const allQuotes=[...CHINESE_QUOTES];
  const shuffledQuotes=shuffle(allQuotes);
  
  // 確保拿到3句有效詩句
  const validQuotes=[];
  for(const q of shuffledQuotes){
    const p=splitQuote(q);
    if(p.first&&p.second&&p.first.length>0&&p.second.length>0){
      validQuotes.push({quote:q,first:p.first,second:p.second});
      if(validQuotes.length>=3) break;
    }
  }
  
  if(validQuotes.length<3) return [];
  
  // 第一句：選擇下一句
  const q1=validQuotes[0];
  const ws1=shuffle(allQuotes.map(x=>splitQuote(x).second).filter(x=>x&&x!==q1.second)).slice(0,4);
  const o1=shuffle([q1.second,...ws1]);
  
  // 第二句：填空題
  const q2=validQuotes[1];
  const kw=extractKeyword(q2.quote)||q2.first;
  const bq=q2.quote.replace(kw,'______');
  
  // 第三句：選擇上一句
  const q3=validQuotes[2];
  const ws2=shuffle(allQuotes.map(x=>splitQuote(x).first).filter(x=>x&&x!==q3.first)).slice(0,4);
  const o2=shuffle([q3.first,...ws2]);
  
  return [
    {id:'cn1',type:'choice',subject:'chinese',question:`請選出「${q1.first}」的下一句`,options:o1,answer:o1.indexOf(q1.second),hint:`完整名句：${q1.quote}`,fullQuote:q1.quote},
    {id:'cn2',type:'fill',subject:'chinese',question:`請填入空格中的正確內容：${bq}`,answer:kw,acceptBoth:true,hint:`完整名句：${q2.quote}`,fullQuote:q2.quote},
    {id:'cn3',type:'choice',subject:'chinese',question:`請選出「${q3.second}」的上一句`,options:o2,answer:o2.indexOf(q3.first),hint:`完整名句：${q3.quote}`,fullQuote:q3.quote}
  ];
}

function genMath(){
  // 使用真正隨機數，每次練習都不同
  // 隨機選擇3道選擇題（從擴充後的題庫）
  const choiceIndices = shuffle([...Array(MATH_CHOICE.length).keys()]);
  const i1 = choiceIndices[0];
  const i2 = choiceIndices[1];
  const i3 = choiceIndices[2];
  
  // 隨機選擇2道填空題
  const fillIndices = shuffle([...Array(MATH_FILL.length).keys()]);
  const f1 = fillIndices[0];
  const f2 = fillIndices[1];
  
  return [
    {id:'mt1',type:'choice',subject:'math',question:MATH_CHOICE[i1].q,options:MATH_CHOICE[i1].opts,answer:MATH_CHOICE[i1].ans,hint:MATH_CHOICE[i1].hint},
    {id:'mt2',type:'choice',subject:'math',question:MATH_CHOICE[i2].q,options:MATH_CHOICE[i2].opts,answer:MATH_CHOICE[i2].ans,hint:MATH_CHOICE[i2].hint},
    {id:'mt3',type:'choice',subject:'math',question:MATH_CHOICE[i3].q,options:MATH_CHOICE[i3].opts,answer:MATH_CHOICE[i3].ans,hint:MATH_CHOICE[i3].hint},
    {id:'mt4',type:'fill',subject:'math',question:MATH_FILL[f1].q,answer:MATH_FILL[f1].ans,hint:MATH_FILL[f1].hint},
    {id:'mt5',type:'fill',subject:'math',question:MATH_FILL[f2].q,answer:MATH_FILL[f2].ans,hint:MATH_FILL[f2].hint}
  ];
}

function genEnglish(){
  // 使用真正隨機數，每次練習都不同
  const bank=ENGLISH_BANK;
  const shuffledBank=shuffle([...bank]);
  const selected=shuffledBank.slice(0,3);
  
  return selected.map((q,i)=>{
    if(q.opts) return {id:'en'+(i+1),type:'choice',subject:'english',question:q.q,options:q.opts,answer:q.ans,hint:q.hint,alts:q.alts};
    else return {id:'en'+(i+1),type:'fill',subject:'english',question:q.q,answer:q.ans,acceptBoth:q.type==='fill_cn',hint:q.hint,alts:q.alts};
  });
}

  else if(state.page==='quiz') renderQuiz(app);
  else if(state.page==='result') renderResult(app);
  else if(state.page==='wrong') renderWrongAnswers(app);
}

window.startSubject=function(id){
  let qs=[];
  if(id==='chinese') qs=genChinese();
  else if(id==='math') qs=genMath();
  else if(id==='english') qs=genEnglish();
  if(qs.length>0){
    state.subject=id;state.questions=qs;state.currentQ=0;state.results=[];state.page='quiz';
    render();
  }
};

window.toggleHint=function(){
  const c=document.getElementById('hintContent');
  const l=document.getElementById('hintLabel');
  if(c.classList.contains('show')){c.classList.remove('show');l.textContent='提示 (Hint)';}
  else{c.classList.add('show');l.textContent='隱藏提示';}
};

window.selectChoice=function(idx){
  const q=state.questions[state.currentQ];
  const correct=idx===q.answer;
  state.results.push(correct);
  // 記錄錯題（包含完整信息）
  if(!correct) recordWrongAnswer(
    q.question, 
    q.options[idx], 
    q.options[q.answer], 
    state.subject,
    q.options,     // 選項列表
    q.hint,        // 提示/解題思路
    q.fullQuote,   // 完整引用
    q.type,        // 題目類型
    q.alts,        // 備選答案
    idx            // 用戶選擇的索引
  );
  // 如果是複習模式答對，移除該錯題
  if(correct && q.id && q.id.startsWith('retry') && q.originalQuestion) {
    removeWrongAnswer(q.question, state.subject);
  }
  showFeedback(correct,q);
  // 更新按鈕樣式
  const btns=document.querySelectorAll('.choice-btn');
  btns.forEach((btn,i)=>{
    btn.disabled=true;
    btn.classList.remove('hover:border-duo-blue');
    if(i===q.answer) btn.className='choice-btn w-full text-left p-4 rounded-duo font-nunito font-semibold text-base bg-duo-green border-2 border-duo-green text-white mb-3 shadow-duo-green';
    else if(i===idx&&!correct) btn.className='choice-btn w-full text-left p-4 rounded-duo font-nunito font-semibold text-base bg-duo-red border-2 border-duo-red text-white mb-3 shadow-duo-red';
    else btn.className='choice-btn w-full text-left p-4 rounded-duo font-nunito font-semibold text-base bg-gray-50 border-2 border-transparent text-secondary mb-3';
  });
};

window.submitFill=function(){
  const input=document.getElementById('fillInput');
  if(!input||!input.value.trim()) return;
  const q=state.questions[state.currentQ];
  let correct=checkMatch(input.value,q.answer);
  let matchedAlt=-1;
  if(!correct&&q.alts) {
    matchedAlt=q.alts.findIndex(a=>checkMatch(input.value,a));
    if(matchedAlt>=0) correct=true;
  }
  state.results.push(correct);
  // 記錄錯題（包含完整信息）
  if(!correct) recordWrongAnswer(
    q.question, 
    input.value, 
    q.answer, 
    state.subject,
    null,         // 填空題沒有選項
    q.hint,       // 提示/解題思路
    q.fullQuote,  // 完整引用
    q.type,       // 題目類型
    q.alts,       // 備選答案
    matchedAlt    // 匹配到的備選索引，-1表示都沒匹配
  );
  // 如果是複習模式答對，移除該錯題
  if(correct && q.id && q.id.startsWith('retry') && q.originalQuestion) {
    removeWrongAnswer(q.question, state.subject);
  }
  input.disabled=true;
  input.classList.add(correct?'border-duo-green':'border-duo-red');
  if(!correct){
    const hint=document.createElement('p');
    hint.className='text-duo-red font-nunito text-sm mt-2';
    hint.textContent='正確答案：'+q.answer;
    input.parentElement.parentElement.appendChild(hint);
  }
  const submitBtn=input.parentElement.querySelector('button');
  if(submitBtn) submitBtn.disabled=true;
  showFeedback(correct,q);
};

function showFeedback(correct,q){
  const fb=document.getElementById('feedbackBar');
  fb.className=`feedback-bar fixed bottom-0 left-0 right-0 z-50 p-4 flex items-center justify-between ${correct?'bg-duo-green':'bg-duo-red'}`;
  document.getElementById('fbEmoji').textContent=correct?'✅':'❌';
  document.getElementById('fbMsg').textContent=correct?'答對了！太棒了！':'答錯了，再接再厲！';
  setTimeout(()=>fb.classList.add('show'),50);
}

window.nextQuestion=function(){
  const fb=document.getElementById('feedbackBar');
  fb.classList.remove('show');
  setTimeout(()=>{
    if(state.currentQ+1>=state.questions.length){
      state.page='result';render();
    } else {
      state.currentQ++;render();
    }
  },300);
};

window.goHome=function(){state.page='home';state.subject=null;state.questions=[];render();};

  const pct=Math.round(correct/total*100);
  const xp=correct*10+(pct>=80?20:0);

  else if(pct>=33){emoji='💪';msg='不錯的嘗試，再接再厲！';}
  const names={chinese:'中文',math:'數學',english:'英文'};
  const strokeColor=pct>=67?'#58CC02':pct>=33?'#FF9600':'#FF4B4B';
  const offset=314*(1-pct/100);

  addXP(xp);
  saveCompletion(state.subject);

  app.innerHTML=`
    <div class="min-h-screen bg-white flex flex-col items-center justify-center px-4 py-6 page-enter">
      <!-- 頂部工具欄 -->
      <div class="absolute top-4 right-4">
        <button onclick="toggleDarkMode()" class="theme-toggle w-10 h-10 rounded-full bg-white shadow-md flex items-center justify-center hover:shadow-lg transition-all" title="${state.darkMode?'切換到明亮模式':'切換到深色模式'}">
          ${state.darkMode?'<span class="text-lg">☀️</span>':'<span class="text-lg">🌙</span>'}
        </button>
      </div>
      <div class="text-center">
        <div class="text-8xl mb-6">${emoji}</div>
        <h1 class="text-primary font-nunito font-black text-3xl mb-2">${names[state.subject]} 練習完成！</h1>
        <p class="text-secondary font-nunito font-semibold text-lg mb-8">${msg}</p>
        <div class="relative w-40 h-40 mx-auto mb-8">
          <svg class="w-full h-full -rotate-90" viewBox="0 0 120 120">
            <circle cx="60" cy="60" r="50" fill="none" stroke="#E5E5E5" stroke-width="10"/>
            <circle cx="60" cy="60" r="50" fill="none" stroke="${strokeColor}" stroke-width="10" stroke-linecap="round"
              stroke-dasharray="314" stroke-dashoffset="${offset}" style="transition:stroke-dashoffset 1.5s ease-out"/>
          </svg>
          <div class="absolute inset-0 flex flex-col items-center justify-center">
            <span class="text-primary font-nunito font-black text-4xl">${pct}%</span>
            <span class="text-secondary font-nunito text-xs">${correct}/${total} 正確</span>
          </div>
        </div>
        <div class="bg-white rounded-duo-lg p-4 mb-8 inline-block shadow-md">
          <span class="text-duo-gold font-nunito font-black text-2xl">+${xp} XP</span>

        </div>
        <br>
        <button onclick="finishQuiz()" class="bg-duo-green text-white font-nunito font-black text-lg px-10 py-4 rounded-duo shadow-duo-green active:translate-y-[2px] active:shadow-none transition-all subject-btn">
          繼續學習
        </button>
      </div>
    </div>`;
}

window.finishQuiz=function(){state.page='home';state.subject=null;state.questions=[];render();};

// 顯示錯題分析
window.showWrongAnswers=function(subject){
  state.page='wrong';
  state.wrongSubject=subject;
  render();
};

// 再做一次錯題
window.retryWrongQuestions=function(subject){
  const wrongList=getWrongAnswersBySubject(subject);
  if(wrongList.length===0) return;
  
  // 從錯題列表生成題目
  const questions=wrongList.map((w,i)=>({
    id:'retry'+(i+1),
    type:w.type||'choice',
    subject:subject,
    question:w.question,
    options:w.options||null,
    answer:w.answer,
    hint:w.hint||'',
    fullQuote:w.fullQuote||'',
    alts:w.alts||null,
    originalQuestion:w.question  // 保存原始題目用於移除錯題
  }));
  
  state.subject=subject;
  state.questions=questions;
  state.currentQ=0;
  state.results=[];
  state.page='quiz';
  render();
};

function renderWrongAnswers(app){
  const subject=state.wrongSubject;
  const names={chinese:'中文',math:'數學',english:'英文'};
  const colors={chinese:'bg-duo-orange',math:'bg-duo-green',english:'bg-duo-blue'};
  const iconMap={chinese:'📖',math:'📐',english:'🔤'};
  const wrongList=getWrongAnswersBySubject(subject);
  
  // 根據科目生成解題思路HTML
  const generateSolution=(w)=>{
    if(subject==='math'){
      return `
        <div class="bg-gradient-to-r from-green-50 to-emerald-50 border border-green-200 rounded-xl p-4 mb-4">
          <div class="flex items-center gap-2 mb-2">
            <span class="text-xl">📐</span>
            <span class="font-bold text-green-700">解題思路</span>
          </div>
          <div class="text-gray-700 text-sm leading-relaxed solution-hint math-hint">${w.hint||'本題考查數學概念與計算能力'}</div>
        </div>
        ${w.fullQuote?`
        <div class="bg-blue-50 border border-blue-200 rounded-xl p-3">
          <p class="text-xs text-blue-500 font-medium mb-1">答題關鍵</p>
          <p class="text-blue-700 text-sm">${w.fullQuote}</p>
        </div>`:''}
      `;
    } else if(subject==='chinese'){
      const tip = generateMemoryTip(w.fullQuote || w.question);
      return `
        <div class="bg-gradient-to-r from-orange-50 to-amber-50 border border-orange-200 rounded-xl p-4 mb-4">
          <div class="flex items-center gap-2 mb-2">
            <span class="text-xl">📜</span>
            <span class="font-bold text-orange-700">名句解讀</span>
          </div>
          <p class="text-gray-700 text-sm leading-relaxed mb-2">${w.hint||'理解古詩文的意境與情感'}</p>
          ${w.fullQuote?`
          <div class="bg-white/60 rounded-lg p-3 mt-2 border-l-4 border-orange-400">
            <p class="text-orange-700 font-bold text-base hint-text leading-relaxed">「${w.fullQuote}」</p>
          </div>
          `:''}
        </div>
        
        <!-- 🎬 視覺化記憶 -->
        <div class="memory-card bg-gradient-to-br from-blue-50 to-indigo-50 border border-blue-200 rounded-xl p-4 mb-3">
          <div class="flex items-center gap-2 mb-2">
            <span class="text-lg">🎬</span>
            <span class="font-bold text-blue-700 text-sm">視覺化想像</span>
          </div>
          <p class="text-gray-700 text-sm leading-relaxed">${tip.visual}</p>
        </div>

        <!-- 🔄 對比聯想 -->
        <div class="memory-card bg-gradient-to-br from-emerald-50 to-teal-50 border border-emerald-200 rounded-xl p-4 mb-3">
          <div class="flex items-center gap-2 mb-2">
            <span class="text-lg">🔄</span>
            <span class="font-bold text-emerald-700 text-sm">對比 & 聯想</span>
          </div>
          <p class="text-gray-700 text-sm leading-relaxed">${tip.compare}</p>
        </div>

        ${tip.scene?`
        <div class="memory-card bg-gradient-to-br from-purple-50 to-violet-50 border border-purple-200 rounded-xl p-4 mb-3">
          <div class="flex items-center gap-2 mb-2">
            <span class="text-lg">🎭</span>
            <span class="font-bold text-purple-700 text-sm">情境演繹</span>
          </div>
          <p class="text-gray-700 text-sm leading-relaxed">${tip.scene}</p>
        </div>`:''}

        <!-- 🔑 記憶關鍵字 -->
        <div class="bg-gradient-to-r from-yellow-50 to-amber-50 border border-yellow-300 rounded-xl p-3">
          <div class="flex items-center gap-2">
            <span class="text-yellow-600">🔑</span>
            <span class="text-xs text-yellow-600 font-bold">快速記憶口訣</span>
          </div>
          <p class="text-yellow-800 font-medium text-sm mt-1">${tip.keyword}</p>
        </div>
      `;
    } else {
      return `
        <div class="bg-gradient-to-r from-blue-50 to-indigo-50 border border-blue-200 rounded-xl p-4 mb-4">
          <div class="flex items-center gap-2 mb-2">
            <span class="text-xl">🔤</span>
            <span class="font-bold text-blue-700">詞彙詳解</span>
          </div>
          <div class="text-gray-700 text-sm leading-relaxed">${w.hint||'掌握單詞的詞根詞綴和應用場景'}</div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div class="bg-green-50 border border-green-200 rounded-xl p-3">
            <p class="text-xs text-green-500 font-medium mb-1">正確答案</p>
            <p class="text-green-700 font-bold">${w.correctAnswer}</p>
          </div>
          <div class="bg-red-50 border border-red-200 rounded-xl p-3">
            <p class="text-xs text-red-500 font-medium mb-1">你的答案</p>
            <p class="text-red-700 font-bold">${w.userAnswer}</p>
          </div>
        </div>
      `;
    }
  };
  
  app.innerHTML=`
    <div class="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100 flex flex-col page-enter">
      <!-- 頂部導航 -->
      <div class="w-full max-w-2xl mx-auto px-6 pt-8 pb-4">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-4">
            <button onclick="state.page='home';render();" class="w-10 h-10 bg-white rounded-full shadow-md flex items-center justify-center hover:bg-gray-50 transition-colors">
              <span class="text-xl">←</span>
            </button>
            <!-- 深色模式切換 -->
            <button onclick="toggleDarkMode()" class="theme-toggle w-9 h-9 rounded-full bg-white shadow-md flex items-center justify-center hover:shadow-lg" title="${state.darkMode?'切換到明亮模式':'切換到深色模式'}">
              ${state.darkMode?'<span class="text-sm">☀️</span>':'<span class="text-sm">🌙</span>'}
            </button>
          </div>
            <div class="flex items-center gap-3">
              <div class="w-12 h-12 ${colors[subject]} rounded-xl flex items-center justify-center shadow-md">
                <span class="text-2xl">${iconMap[subject]}</span>
              </div>
              <div>
                <h1 class="text-xl font-black text-gray-800">${names[subject]} 錯題分析</h1>
                <p class="text-xs text-gray-400">共 ${wrongList.length} 題待複習</p>
              </div>
            </div>
          </div>
        </div>
      </div>
      
      <!-- 操作按鈕 -->
      ${wrongList.length>0?`
      <div class="w-full max-w-2xl mx-auto px-6 pb-4">
        <div class="flex gap-3">
          <button onclick="retryWrongQuestions('${subject}')" 
            class="flex-1 bg-gradient-to-r from-green-400 to-emerald-500 text-white font-bold py-3 px-6 rounded-xl shadow-lg hover:shadow-xl transition-all flex items-center justify-center gap-2">
            <span class="text-xl">🔄</span>
            <span>再做一次 (${wrongList.length}題)</span>
          </button>
          <button onclick="clearWrongAnswers('${subject}');state.page='home';render();" 
            class="px-6 py-3 bg-white text-gray-600 font-semibold rounded-xl shadow-md hover:bg-gray-50 transition-all">
            一鍵清除
          </button>
        </div>
      </div>
      `:''}
      
      <!-- 錯題列表 -->
      <div class="flex-1 px-6 pb-6">
        <div class="w-full max-w-2xl mx-auto">
          ${wrongList.length===0?`
            <div class="bg-white rounded-2xl shadow-lg p-12 text-center">
              <span class="text-6xl mb-4 block">🎉</span>
              <h2 class="text-xl font-black text-gray-800 mb-2">太棒了！</h2>
              <p class="text-gray-500 mb-6">這個科目目前沒有錯題，繼續保持！</p>
              <button onclick="state.page='home';render();" class="bg-green-500 text-white font-bold py-3 px-8 rounded-xl shadow-lg hover:bg-green-600 transition-all">
                返回首頁
              </button>
            </div>
          `:` 
            <div class="space-y-4">
              ${wrongList.map((w,i)=>`
                <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
                  <!-- 題目區 -->
                  <div class="p-5 border-b border-gray-100">
                    <div class="flex items-center gap-3 mb-3">
                      <div class="w-8 h-8 ${colors[subject]} rounded-full flex items-center justify-center shrink-0">
                        <span class="text-white font-bold text-sm">${i+1}</span>
                      </div>
                      <span class="text-xs text-gray-400">錯題回顧</span>
                    </div>
                    <h3 class="text-gray-800 font-bold text-base mb-2 leading-relaxed math-q">${w.question}</h3>
                    ${w.options?`
                    <div class="space-y-2 mt-3">
                      ${w.options.map((opt,oi)=>`
                        <div class="flex items-center gap-2 p-2 rounded-lg ${oi===w.answer?'bg-green-50 border border-green-300':'${oi===w.userAnswerIndex?"bg-red-50 border border-red-300":"bg-gray-50 border border-transparent"}'}">
                          <span class="text-sm font-medium ${oi===w.answer?'text-green-600':'text-gray-500'}">${String.fromCharCode(65+oi)}.</span>
                          <span class="text-sm math-opt ${oi===w.answer?'font-bold text-green-700':'text-gray-600'}">${opt}</span>
                          ${oi===w.answer?'<span class="ml-auto text-green-500 text-sm">✓ 正確</span>':''}
                          ${oi===w.userAnswerIndex&&oi!==w.answer?'<span class="ml-auto text-red-500 text-sm">✗ 你的答案</span>':''}
                        </div>
                      `).join('')}
                    </div>
                    `:`<div class="bg-gray-50 rounded-lg p-3">
                      <p class="text-xs text-gray-400 mb-1">你的答案</p>
                      <p class="text-red-600 font-semibold">${w.userAnswer}</p>
                    </div>`}
                  </div>
                  
                  <!-- 解題思路區 -->
                  <div class="p-5 bg-gray-50/50">
                    ${generateSolution(w)}
                  </div>
                </div>
              `).join('')}
            </div>
            
            <!-- 底部操作 -->
            <div class="mt-6 bg-white rounded-2xl shadow-lg p-6">
              <div class="flex items-center gap-3 mb-4">
                <span class="text-2xl">💡</span>
                <h3 class="text-gray-800 font-black text-lg">學習建議</h3>
              </div>
              <ul class="space-y-2 text-gray-600 text-sm">
                <li class="flex items-start gap-2">
                  <span class="text-green-500 mt-0.5">✓</span>
                  <span>仔細閱讀解題思路，理解每個步驟</span>
                </li>
                <li class="flex items-start gap-2">
                  <span class="text-green-500 mt-0.5">✓</span>
                  <span>點擊「再做一次」檢驗學習成果</span>
                </li>
                <li class="flex items-start gap-2">
                  <span class="text-green-500 mt-0.5">✓</span>
                  <span>答對後錯題會自動從列表移除</span>
                </li>
              </ul>
            </div>
          `}
        </div>
      </div>
    </div>`;
  
  // 渲染數學公式 - 增強版
  setTimeout(()=>{
    const container = document.querySelector('.min-h-screen');
    if(container) renderAllMath(container);
  },100);
}

// ============================================================
// 初始化
// ============================================================
loadState();
initDarkMode();
render();
</script>
</body>
</html>
